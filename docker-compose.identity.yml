services:
  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-platform:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME:?Set PLATFORM_DB_NAME}
      POSTGRES_USER: ${PLATFORM_DB_USER:?Set PLATFORM_DB_USER}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD}
      PLATFORM_APP_DB_USER: ${PLATFORM_APP_DB_USER:?Set PLATFORM_APP_DB_USER}
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?Set PLATFORM_APP_DB_PASSWORD}
    ports:
      - '${PLATFORM_DB_PORT:-5433}:5432'
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/platform:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD}',
      ]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
      [
        'start-dev',
        '--import-realm',
        '--metrics-enabled=true',
        '--health-enabled=true',
      ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled
    ports:
      - '${KONG_PROXY_PORT:-8000}:8000'
      - '${KONG_ADMIN_PORT:-8001}:8001'
    volumes:
      - ./infra/kong/kong.yml:/opt/kong/kong.yml:ro
    depends_on:
      keycloak:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.retention.time=15d',
      ]

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  keycloak-postgres-data:
  platform-postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
